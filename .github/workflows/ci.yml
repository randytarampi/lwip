name: CI
on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    strategy:
      fail-fast: false
      matrix:
        # Node 24.18.0 is pinned because Node 24.20 has a native-addon teardown crash that kills node-gyp-built addons like this one; unpinned `24` silently broke the suite.
        node-version: [22, 24.18.0]
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      GYP_MSVS_VERSION: ${{ matrix.os == 'windows-latest' && '2022' || '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: yarn
      - run: corepack enable
        shell: bash
      - name: Cache Yarn
        uses: actions/cache@v6
        with:
          path: |
            .yarn/cache
            node_modules
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            yarn-${{ runner.os }}-
      - name: Install dependencies
        env:
          YARN_ENABLE_HARDENED_MODE: false
        run: yarn install --immutable --network-timeout 600000
        shell: bash
      - run: yarn build:native
        shell: bash
      - run: yarn verify
        shell: bash
      - name: Coveralls
        if: runner.os == 'Linux'
        uses: coverallsapp/github-action@v2
        with:
          file: coverage/lcov.info
          flag-name: ${{ matrix.node-version }}
          parallel: true


  finish:
    needs: node
    runs-on: ubuntu-latest
    steps:
      - name: Coveralls Finished
        uses: coverallsapp/github-action@v2
        with:
          parallel-finished: true
