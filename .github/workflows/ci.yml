name: CI
on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    strategy:
      fail-fast: false
      matrix:
        # Node 24.18.0 is pinned because Node 24.20 has a native-addon teardown crash that kills node-gyp-built addons like this one; unpinned `24` silently broke the suite.
        node-version: [22, 24.18.0]
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      GYP_MSVS_VERSION: ${{ matrix.os == 'windows-latest' && '2022' || '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: yarn
      - run: corepack enable
      - name: Cache Yarn
        uses: actions/cache@v6
        with:
          path: |
            .yarn/cache
            node_modules
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            yarn-${{ runner.os }}-
      - name: Install dependencies
        env:
          YARN_ENABLE_HARDENED_MODE: false
        run: yarn install --immutable --network-timeout 600000
      - run: yarn build:native
      - run: yarn verify
      - name: Coveralls
        if: runner.os == 'Linux'
        uses: coverallsapp/github-action@v2
        with:
          file: coverage/lcov.info
          flag-name: ${{ matrix.node-version }}
          parallel: true

  appveyor:
    if: ${{ github.event_name == 'push' }}
    name: Wait for the AppVeyor (Windows) build
    runs-on: ubuntu-latest
    steps:
      - name: Wait for the AppVeyor build of this commit
        shell: bash
        run: |
          set -euo pipefail
          sha="${{ github.sha }}"
          slug="randytarampi/lwip"
          echo "Waiting for the AppVeyor build of ${sha}"
          for i in $(seq 1 45); do
            response=$(mktemp)
            trap 'rm -f "$response"' EXIT
            curl -sf --max-time 30 "https://ci.appveyor.com/api/projects/${slug}" > "$response" || true
            status=$(SHA="$sha" python3 - "$response" <<'PY'
          import json
          import os
          import sys

          with open(sys.argv[1], encoding="utf-8") as response:
              data = json.load(response)
          build = data.get("build") or {}
          print(build.get("status") or "notfound" if (build.get("commitId") or "").lower() == os.environ["SHA"].lower() else "notfound")
          PY
            ) || status=notfound
            echo "poll ${i}: ${status}"
            case "$status" in
              success) exit 0 ;;
              failed|error|cancelled) echo "::error::AppVeyor build ${status} for ${sha}"; exit 1 ;;
            esac
            sleep 60
          done
          echo "::error::AppVeyor build for ${sha} did not finish in 45 minutes"
          exit 1

  finish:
    needs: node
    runs-on: ubuntu-latest
    steps:
      - name: Coveralls Finished
        uses: coverallsapp/github-action@v2
        with:
          parallel-finished: true
