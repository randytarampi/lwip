name: Release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
      id-token: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      NPM_CONFIG_PROVENANCE: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Verify the CI run matches this commit
        run: |
          if [ "${{ github.event.workflow_run.head_sha }}" != "$(git rev-parse HEAD)" ]; then
            echo "::error::CI run head ${{ github.event.workflow_run.head_sha }} does not match checkout $(git rev-parse HEAD) - skipping release"
            exit 1
          fi

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          # Node 24.18.0 is pinned because Node 24.20 has a native-addon teardown crash that kills node-gyp-built addons like this one; the release toolchain must match the tested toolchain so a release is not built in the broken-toolchain environment.
          node-version: 24.18.0
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build native addon
        run: yarn build:native

      - name: Run semantic-release
        run: npx semantic-release
