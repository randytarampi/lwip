name: Release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
      id-token: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify the CI run matches this commit
        run: |
          if [ "${{ github.event.workflow_run.head_sha }}" != "$(git rev-parse HEAD)" ]; then
            echo "::error::CI run head ${{ github.event.workflow_run.head_sha }} does not match checkout $(git rev-parse HEAD) - skipping release"
            exit 1
          fi

      # NOTE-RT: CI waits for AppVeyor in parallel; re-check it before publishing.
      - name: Re-verify the AppVeyor build
        shell: bash
        run: |
          set -euo pipefail
          sha="${{ github.event.workflow_run.head_sha }}"
          slug="randytarampi/lwip"
          echo "Verifying the AppVeyor build of ${sha}"
          for i in $(seq 1 45); do
            response=$(mktemp)
            trap 'rm -f "$response"' EXIT
            curl -sf --max-time 30 "https://ci.appveyor.com/api/projects/${slug}" > "$response" || true
            status=$(SHA="$sha" python3 - "$response" <<'PY'
          import json
          import os
          import sys

          with open(sys.argv[1], encoding="utf-8") as response:
              data = json.load(response)
          build = data.get("build") or {}
          print(build.get("status") or "notfound" if (build.get("commitId") or "").lower() == os.environ["SHA"].lower() else "notfound")
          PY
            ) || status=notfound
            echo "poll ${i}: ${status}"
            case "$status" in
              success) exit 0 ;;
              failed|error|cancelled) echo "::error::AppVeyor build ${status} for ${sha}"; exit 1 ;;
            esac
            sleep 60
          done
          echo "::error::AppVeyor build for ${sha} did not finish in 45 minutes"
          exit 1

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build native addon
        run: yarn build:native

      - name: Run semantic-release
        run: npx semantic-release
